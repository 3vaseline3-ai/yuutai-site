    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --accent-cyan: #00d4ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --accent-purple: #a855f7;
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1445 0%, #1a0a2e 50%, #16213e 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated mesh gradient background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before,
        .bg-animation::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .bg-animation::before {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-animation::after {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0891b2 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            animation-delay: -10s;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 25s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 40%;
            left: 30%;
            animation-delay: -5s;
        }

        .bg-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            top: 60%;
            right: 20%;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(-30px, -20px) scale(1.02); }
        }

        /* Noise overlay for texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Glass navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            margin-bottom: 24px;
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-inner::-webkit-scrollbar {
            display: none;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        nav a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
        }

        nav a.nav-home {
            color: var(--accent-cyan);
            font-weight: 700;
            margin-right: 8px;
        }

        nav a.nav-home:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.3);
        }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px var(--glass-shadow);
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Table styles */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-secondary);
            font-weight: 500;
            padding: 14px 12px;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--glass-border);
        }

        th:first-child {
            border-radius: 12px 0 0 0;
        }

        th:last-child {
            border-radius: 0 12px 0 0;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:last-child td:first-child {
            border-radius: 0 0 0 12px;
        }

        tbody tr:last-child td:last-child {
            border-radius: 0 0 12px 0;
        }

        /* Number formatting */
        .number {
            text-align: right;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }

        /* Value colors */
        .positive {
            color: var(--accent-green);
            font-weight: 600;
        }

        .negative {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* Links */
        a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #5eead4;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            margin-left: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.3);
            color: #c4b5fd;
            border-radius: 6px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            nav {
                padding: 12px 16px;
            }

            nav a {
                padding: 6px 10px;
                font-size: 0.85rem;
            }

            .container {
                padding: 0 16px 24px;
            }

            .glass-card {
                padding: 16px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>

<script src="../assets/yuutai_ext.js" defer></script>
<script>
const MONTH = 8;
const STORAGE_KEY_PORTFOLIO = `yuutai_portfolio_${MONTH}`;
const STORAGE_KEY_CAPITAL = 'yuutai_capital';

const table = document.querySelector('table');
const tbody = document.querySelector('tbody');
const originalOrder = Array.from(tbody.querySelectorAll('tr'));

// Portfolio elements
const availableCapitalInput = document.getElementById('available-capital');
const selectedCountEl = document.getElementById('selected-count');
const totalCapitalEl = document.getElementById('total-capital');
const totalYuutaiEl = document.getElementById('total-yuutai');
const portfolioYieldEl = document.getElementById('portfolio-yield');
const capitalWarningEl = document.getElementById('capital-warning');
const selectAllCheckbox = document.getElementById('select-all');
const clearSelectionBtn = document.getElementById('clear-selection');

// Number formatting
function formatNumber(num) {
    return num.toLocaleString('ja-JP');
}

// Parse number from formatted string
function parseNumber(str) {
    return parseInt(str.replace(/,/g, '')) || 0;
}

// Load selection from localStorage
function loadSelection() {
    const saved = localStorage.getItem(STORAGE_KEY_PORTFOLIO);
    if (saved) {
        const selectedKeys = JSON.parse(saved);
        selectedKeys.forEach(key => {
            const checkbox = document.querySelector(`.stock-checkbox[data-key="${key}"]`);
            if (checkbox) checkbox.checked = true;
        });
    }

    const savedCapital = localStorage.getItem(STORAGE_KEY_CAPITAL);
    if (savedCapital) {
        availableCapitalInput.value = formatNumber(parseInt(savedCapital));
    }
}

// Save selection to localStorage
function saveSelection() {
    const selectedKeys = [];
    document.querySelectorAll('.stock-checkbox:checked').forEach(cb => {
        selectedKeys.push(cb.dataset.key);
    });
    localStorage.setItem(STORAGE_KEY_PORTFOLIO, JSON.stringify(selectedKeys));
}

// Save capital to localStorage
function saveCapital() {
    const capital = parseNumber(availableCapitalInput.value);
    localStorage.setItem(STORAGE_KEY_CAPITAL, capital.toString());
}

// Calculate portfolio
function calculatePortfolio() {
    let totalAmount = 0;
    let totalYuutai = 0;
    let weightedPerformance = 0;
    let count = 0;

    document.querySelectorAll('.stock-checkbox:checked').forEach(cb => {
        const row = cb.closest('tr');
        const amount = parseFloat(row.dataset.amount) || 0;
        const yuutai = parseFloat(row.dataset.yuutai) || 0;
        const performance = parseFloat(row.dataset.performance) || 0;

        totalAmount += amount;
        totalYuutai += yuutai;
        weightedPerformance += performance * amount;
        count++;
    });

    const availableCapital = parseNumber(availableCapitalInput.value);
    const portfolioYield = totalAmount > 0 ? weightedPerformance / totalAmount : 0;

    // Update UI
    selectedCountEl.textContent = count;
    totalCapitalEl.textContent = '¥' + formatNumber(totalAmount);
    totalYuutaiEl.textContent = '¥' + formatNumber(totalYuutai);
    portfolioYieldEl.textContent = portfolioYield.toFixed(2) + '%';

    // Capital warning
    if (availableCapital > 0 && totalAmount > availableCapital) {
        capitalWarningEl.classList.add('show');
        capitalWarningEl.querySelector('span').textContent =
            `資金が ¥${formatNumber(totalAmount - availableCapital)} 不足しています`;
    } else {
        capitalWarningEl.classList.remove('show');
    }

    // Update select all checkbox
    const allCheckboxes = document.querySelectorAll('.stock-checkbox');
    const visibleCheckboxes = Array.from(allCheckboxes).filter(cb => cb.closest('tr').style.display !== 'none');
    const checkedVisible = visibleCheckboxes.filter(cb => cb.checked).length;
    selectAllCheckbox.checked = visibleCheckboxes.length > 0 && checkedVisible === visibleCheckboxes.length;
    selectAllCheckbox.indeterminate = checkedVisible > 0 && checkedVisible < visibleCheckboxes.length;
}

// Checkbox events
document.querySelectorAll('.stock-checkbox').forEach(cb => {
    cb.addEventListener('change', () => {
        saveSelection();
        calculatePortfolio();
    });
});

// Select all checkbox
selectAllCheckbox.addEventListener('change', () => {
    const visibleCheckboxes = Array.from(document.querySelectorAll('.stock-checkbox'))
        .filter(cb => cb.closest('tr').style.display !== 'none');
    visibleCheckboxes.forEach(cb => cb.checked = selectAllCheckbox.checked);
    saveSelection();
    calculatePortfolio();
});

// Clear selection button
clearSelectionBtn.addEventListener('click', () => {
    document.querySelectorAll('.stock-checkbox').forEach(cb => cb.checked = false);
    saveSelection();
    calculatePortfolio();
});

// Auto select button
const autoSelectBtn = document.getElementById('auto-select');
autoSelectBtn.addEventListener('click', () => {
    const availableCapital = parseNumber(availableCapitalInput.value);
    if (availableCapital <= 0) {
        alert('利用可能資金を入力してください');
        return;
    }

    // Clear all
    document.querySelectorAll('.stock-checkbox').forEach(cb => cb.checked = false);

    // Sort visible rows by performance
    const visibleRows = Array.from(document.querySelectorAll('tbody tr'))
        .filter(row => row.style.display !== 'none')
        .map(row => ({
            row: row,
            checkbox: row.querySelector('.stock-checkbox'),
            amount: parseFloat(row.dataset.amount) || 0,
            performance: parseFloat(row.dataset.performance) || 0
        }))
        .filter(item => item.amount > 0 && item.performance > 0)
        .sort((a, b) => b.performance - a.performance);

    // Select within budget
    let remainingCapital = availableCapital;
    let selectedCount = 0;

    for (const item of visibleRows) {
        if (item.amount <= remainingCapital) {
            item.checkbox.checked = true;
            remainingCapital -= item.amount;
            selectedCount++;
        }
    }

    saveSelection();
    calculatePortfolio();

    if (selectedCount > 0) {
        console.log(`Auto-selected: ${selectedCount} stocks, remaining: ¥${formatNumber(remainingCapital)}`);
    }
});

// Capital input
availableCapitalInput.addEventListener('input', (e) => {
    const value = e.target.value.replace(/,/g, '').replace(/[^\d]/g, '');
    if (value) {
        e.target.value = formatNumber(parseInt(value));
    }
    saveCapital();
    calculatePortfolio();
});

// Filter functions
function isKarauriOk(row) {
    const isTaishaku = row.dataset.taishaku === 'true';
    const isStop = row.dataset.restriction === '停止';
    const hasIppan = row.dataset.hasIppan === 'true';
    return (isTaishaku && !isStop) || hasIppan;
}

function updateKarauriCount() {
    let count = 0;
    document.querySelectorAll('tbody tr').forEach(row => {
        if (isKarauriOk(row)) count++;
    });
    document.getElementById('karauri-count').textContent = count;
}

function sortByMonthlyYield() {
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
        const yieldA = parseFloat(a.dataset.monthlyYield) || 0;
        const yieldB = parseFloat(b.dataset.monthlyYield) || 0;
        return yieldB - yieldA;
    });
    rows.forEach(row => tbody.appendChild(row));
}

function restoreOrder() {
    originalOrder.forEach(row => tbody.appendChild(row));
}

function applyFilter(filter) {
    if (filter === 'nikko') {
        table.classList.add('nikko-mode');
        sortByMonthlyYield();
    } else {
        table.classList.remove('nikko-mode');
        restoreOrder();
    }

    document.querySelectorAll('tbody tr').forEach(row => {
        if (filter === 'all') {
            row.style.display = '';
        } else if (filter === 'nikko') {
            row.style.display = row.dataset.nikko === 'true' ? '' : 'none';
        } else if (filter === 'karauri') {
            row.style.display = isKarauriOk(row) ? '' : 'none';
        } else if (filter === 'no-karauri') {
            row.style.display = !isKarauriOk(row) ? '' : 'none';
        }
    });

    calculatePortfolio();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        applyFilter(this.dataset.filter);
    });
});

// Initialize
loadSelection();
updateKarauriCount();
applyFilter('all');
calculatePortfolio();
</script>
