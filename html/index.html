    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --accent-cyan: #00d4ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --accent-purple: #a855f7;
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1445 0%, #1a0a2e 50%, #16213e 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated mesh gradient background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before,
        .bg-animation::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .bg-animation::before {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-animation::after {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0891b2 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            animation-delay: -10s;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 25s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 40%;
            left: 30%;
            animation-delay: -5s;
        }

        .bg-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            top: 60%;
            right: 20%;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(-30px, -20px) scale(1.02); }
        }

        /* Noise overlay for texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Glass navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            margin-bottom: 24px;
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-inner::-webkit-scrollbar {
            display: none;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        nav a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
        }

        nav a.nav-home {
            color: var(--accent-cyan);
            font-weight: 700;
            margin-right: 8px;
        }

        nav a.nav-home:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.3);
        }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px var(--glass-shadow);
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Table styles */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-secondary);
            font-weight: 500;
            padding: 14px 12px;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--glass-border);
        }

        th:first-child {
            border-radius: 12px 0 0 0;
        }

        th:last-child {
            border-radius: 0 12px 0 0;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:last-child td:first-child {
            border-radius: 0 0 0 12px;
        }

        tbody tr:last-child td:last-child {
            border-radius: 0 0 12px 0;
        }

        /* Number formatting */
        .number {
            text-align: right;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }

        /* Value colors */
        .positive {
            color: var(--accent-green);
            font-weight: 600;
        }

        .negative {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* Links */
        a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #5eead4;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            margin-left: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.3);
            color: #c4b5fd;
            border-radius: 6px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            nav {
                padding: 12px 16px;
            }

            nav a {
                padding: 6px 10px;
                font-size: 0.85rem;
            }

            .container {
                padding: 0 16px 24px;
            }

            .glass-card {
                padding: 16px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
    
<style>
    .hero-section {
        text-align: center;
        padding: 40px 0 50px;
    }

    .hero-section h1 {
        font-size: 3rem;
        margin-bottom: 16px;
        animation: fadeInUp 0.6s ease-out;
    }

    .hero-subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
        animation: fadeInUp 0.6s ease-out 0.1s both;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Stats row */
    .stats-row {
        display: flex;
        gap: 20px;
        margin-bottom: 50px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .stat-card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 20px 28px;
        min-width: 200px;
        animation: fadeInUp 0.6s ease-out 0.2s both;
    }

    .stat-card:nth-child(2) {
        animation-delay: 0.3s;
    }

    .stat-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
        border-radius: 12px;
        color: white;
    }

    .stat-icon.clock {
        background: linear-gradient(135deg, var(--accent-green), #059669);
    }

    .stat-content {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .stat-value {
        font-family: 'Space Mono', monospace;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
    }

    .stat-value.stat-date {
        font-size: 1rem;
    }

    .stat-label {
        font-size: 0.85rem;
        color: var(--text-secondary);
    }

    /* Section title */
    .section-title {
        text-align: center;
        margin-bottom: 30px;
        font-size: 1.3rem;
        color: var(--text-secondary);
        animation: fadeInUp 0.6s ease-out 0.4s both;
    }

    /* Month grid */
    .month-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
        max-width: 900px;
        margin: 0 auto;
    }

    .month-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 20px;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.5s ease-out both;
    }

    
    .month-card:nth-child(1) {
        animation-delay: 0.45s;
    }
    
    .month-card:nth-child(2) {
        animation-delay: 0.5s;
    }
    
    .month-card:nth-child(3) {
        animation-delay: 0.55s;
    }
    
    .month-card:nth-child(4) {
        animation-delay: 0.6000000000000001s;
    }
    
    .month-card:nth-child(5) {
        animation-delay: 0.65s;
    }
    
    .month-card:nth-child(6) {
        animation-delay: 0.7000000000000001s;
    }
    
    .month-card:nth-child(7) {
        animation-delay: 0.75s;
    }
    
    .month-card:nth-child(8) {
        animation-delay: 0.8s;
    }
    
    .month-card:nth-child(9) {
        animation-delay: 0.8500000000000001s;
    }
    
    .month-card:nth-child(10) {
        animation-delay: 0.9s;
    }
    
    .month-card:nth-child(11) {
        animation-delay: 0.9500000000000001s;
    }
    
    .month-card:nth-child(12) {
        animation-delay: 1.0s;
    }
    

    .month-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 0;
    }

    .month-card:hover {
        transform: translateY(-4px);
        border-color: rgba(0, 212, 255, 0.4);
        box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
    }

    .month-card:hover::before {
        opacity: 0.15;
    }

    .month-card-inner {
        display: flex;
        align-items: baseline;
        gap: 4px;
        z-index: 1;
    }

    .month-number {
        font-family: 'Space Mono', monospace;
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1;
    }

    .month-label {
        font-size: 1rem;
        color: var(--text-secondary);
    }

    .month-arrow {
        color: var(--text-muted);
        transition: all 0.3s ease;
        z-index: 1;
    }

    .month-card:hover .month-arrow {
        color: var(--accent-cyan);
        transform: translateX(4px);
    }

    /* Mobile */
    @media (max-width: 768px) {
        .hero-section {
            padding: 20px 0 30px;
        }

        .hero-section h1 {
            font-size: 2rem;
        }

        .hero-subtitle {
            font-size: 0.95rem;
        }

        .stats-row {
            flex-direction: column;
            align-items: stretch;
            margin-bottom: 40px;
        }

        .stat-card {
            min-width: auto;
            padding: 16px 20px;
        }

        .month-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .month-card {
            padding: 16px;
        }

        .month-number {
            font-size: 1.5rem;
        }

        .month-arrow {
            display: none;
        }
    }

    @media (max-width: 480px) {
        .month-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>

</head>
